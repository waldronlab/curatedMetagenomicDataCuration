name: Data for curatedMetagenomicData Curation by DOI


on:
  workflow_dispatch:
  issues:
    types: [opened] 

jobs:

  curation-comment:
    permissions:
      issues: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    container: bioconductor/bioconductor_docker:devel

    runs-on: ubuntu-latest

    outputs:
      author: ${{ steps.get-doi.outputs.AUTHOR }}
      year: ${{ steps.get-doi.outputs.YEAR }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/R/site-library
            /usr/local/lib/R/library
          key: ${{ runner.os }}-curatedmetagenomicdata-curation

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: "devtools::install()"
        shell: Rscript {0}

      - name: Get DOI
        id: get-doi
        # Untrusted input: pass via env, never interpolate expressions into code.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          library(curatedMetagenomicDataCuration)
          body <- Sys.getenv("ISSUE_BODY")
          doi <- getPattern(body, "doi")
          if (is.na(doi) || !nzchar(doi)) {
              message("No DOI found in issue body; nothing to do.")
              quit(status = 0)
          }
          bioproject_id <- getPattern(body, "bioproject")
          crossref <- getCrossref(doi)
          pmid <- getPmid(doi)

          # Write outputs directly (no shell) and flatten newlines so a
          # value cannot inject extra output lines.
          out <- function(key, value)
              cat(key, "=", gsub("[\r\n]+", " ", value), "\n", sep = "",
                  file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          out("DOI", paste0("https://doi.org/", doi))
          out("AUTHOR", crossref["author"])
          out("TITLE", crossref["title"])
          out("JOURNAL", crossref["journal"])
          out("YEAR", crossref["year"])
          out("PMID", pmid)
          out("BIOPROJECT_ID", bioproject_id)
        shell: Rscript {0}

      - uses: actions/github-script@v7
        if: steps.get-doi.outputs.DOI != ''
        env:
          TITLE: ${{ steps.get-doi.outputs.TITLE }}
          DOI: ${{ steps.get-doi.outputs.DOI }}
          PMID: ${{ steps.get-doi.outputs.PMID }}
          AUTHOR: ${{ steps.get-doi.outputs.AUTHOR }}
          JOURNAL: ${{ steps.get-doi.outputs.JOURNAL }}
          YEAR: ${{ steps.get-doi.outputs.YEAR }}
          BIOPROJECT_ID: ${{ steps.get-doi.outputs.BIOPROJECT_ID }}
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Study]: ${process.env.TITLE}`
            })
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 
              `
              ### Title
              ${process.env.TITLE}

              ### DOI
              ${process.env.DOI}

              ### PMID
              ${process.env.PMID}

              ### Author
              ${process.env.AUTHOR}

              ### Journal
              ${process.env.JOURNAL}

              ### Year
              ${process.env.YEAR}

              ### BioProject ID
              ${process.env.BIOPROJECT_ID}

              👋 Thanks for submitting! Attempting to generate templates (may take a few minutes).
              `
            })

  create-templates:

    needs: curation-comment
    if: needs.curation-comment.outputs.author != ''
    
    permissions:
      issues: write
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    container: bioconductor/bioconductor_docker:devel

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/R/site-library
            /usr/local/lib/R/library
          key: ${{ runner.os }}-curatedmetagenomicdata-curation

      - name: Create templates
        id: create-templates
        env:
          AUTHOR: ${{ needs.curation-comment.outputs.author }}
          YEAR: ${{ needs.curation-comment.outputs.year }}
        run: |
          library(curatedMetagenomicDataCuration)
          BASE <- baseName(Sys.getenv("AUTHOR"), Sys.getenv("YEAR"))
          # BASE becomes a path and commit message; keep it filename-safe.
          BASE <- gsub("[^A-Za-z0-9_.-]", "", BASE)
          cat("BASE=", BASE, "\n", sep = "",
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          path <- paste(Sys.getenv("GITHUB_WORKSPACE"), "inst/curated", sep = "/")
          template_exists <- createTemplate(BASE, path)
          if (template_exists) {
              system(paste0("echo CREATED='true' >> $GITHUB_OUTPUT"))
              system(paste0("echo MESSAGE='Success: Created' >> $GITHUB_OUTPUT"))
          } else {
              system(paste0("echo CREATED='false' >> $GITHUB_OUTPUT"))
              system(paste0("echo MESSAGE='Failure: Could not create' >> $GITHUB_OUTPUT"))
          }
        shell: Rscript {0}

      - name: Setup git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Commit templates
        if: ${{ steps.create-templates.outputs.CREATED == 'true' }}
        id: commit-templates
        env:
          BASE: ${{ steps.create-templates.outputs.BASE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add "$GITHUB_WORKSPACE/inst/curated/$BASE/"*.tsv
          git commit -m "Add $BASE"
          git push origin "$DEFAULT_BRANCH"
 
      - uses: actions/github-script@v7
        env:
          MESSAGE: ${{ steps.create-templates.outputs.MESSAGE }}
          BASE: ${{ steps.create-templates.outputs.BASE }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 
              `
              ${process.env.MESSAGE} ${process.env.BASE}
              `
            })
