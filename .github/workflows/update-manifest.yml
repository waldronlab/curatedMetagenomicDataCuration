name: Update study reconciliation manifest

# Keeps inst/extdata/studies_status.csv and studies_runs.tsv in step with two
# things that drift independently:
#
#   1. the curated corpus in this repo  -> push trigger on inst/curated/**
#   2. the pipeline telemetry elsewhere -> weekly schedule
#
# The generator uses only the Python standard library and an unauthenticated
# public API, so there is nothing to install and no secret to manage.

on:
  push:
    branches: [master]
    paths:
      - 'inst/curated/**'
      - 'inst/scripts/build_manifest.py'
      - '.github/workflows/update-manifest.yml'

  schedule:
    # Mondays 06:00 UTC — telemetry changes without anything landing here.
    - cron: '0 6 * * 1'

  workflow_dispatch:

# Two runs committing to master at once would conflict; let the newer win.
concurrency:
  group: update-manifest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild manifest
        run: python3 inst/scripts/build_manifest.py

      - name: Commit if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- inst/extdata/studies_status.csv inst/extdata/studies_runs.tsv; then
            echo "Manifest already current — nothing to commit."
            echo "### Manifest already current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/studies_status.csv inst/extdata/studies_runs.tsv

          # [skip ci] keeps this from re-triggering "Validate Metadata Against
          # Latest Schema", which watches inst/extdata/**. The manifest is a
          # derived artifact — it changes no curated data, so there is nothing
          # for that workflow to check.
          git commit -m "chore(manifest): refresh study reconciliation manifest [skip ci]" \
                     -m "Regenerated by .github/workflows/update-manifest.yml (${{ github.event_name }})."

          git push

          {
            echo "### Manifest updated"
            echo ""
            echo '```'
            git show --stat --oneline HEAD | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
